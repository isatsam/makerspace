version: '3.8'

services:
  makerspacehub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makerspacehub
    ports:
      - "3000:5000"
    volumes:
      # Mount the database directory as a volume so it persists outside the container
      - ./data:/app/src/instance
    environment:
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped
    # Health check to ensure the app is running
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/equipment"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
